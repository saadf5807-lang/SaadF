<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Suspected PE: the whole pathway on one page</text>
  <g font-size="12.5">
    <rect x="330" y="45" width="240" height="40" rx="8" fill="#dde8f3" stroke="#0b3d6b"/>
    <text x="450" y="70" text-anchor="middle" font-weight="bold">Suspected PE: is BP stable?</text>
    <line x1="400" y1="85" x2="200" y2="118" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="500" y1="85" x2="660" y2="118" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
    <rect x="30" y="120" width="340" height="160" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="200" y="143" text-anchor="middle" font-weight="bold" fill="#b3261e">UNSTABLE (persistent hypotension)</text>
    <text x="42" y="166">• Treat BEFORE confirmation</text>
    <text x="42" y="186">• Bedside echo / ECG → RV strain</text>
    <text x="42" y="206">• Low bleeding risk → <tspan font-weight="bold">alteplase</tspan></text>
    <text x="42" y="226">• High bleeding risk → surgical</text>
    <text x="54" y="244">embolectomy / catheter-directed Rx</text>
    <text x="42" y="266">• CTPA / V/Q when stable to move</text>
    <rect x="470" y="120" width="400" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="670" y="140" text-anchor="middle" font-weight="bold" fill="#2e7d32">STABLE (SBP &gt; 90)</text>
    <text x="670" y="157" text-anchor="middle" font-size="11.5">Pregnant? → skip Wells: CXR → normal V/Q · abnormal CTPA</text>
    <line x1="670" y1="164" x2="670" y2="186" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="540" y="188" width="260" height="36" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="670" y="211" text-anchor="middle" font-weight="bold">Wells PE score</text>
    <line x1="600" y1="224" x2="530" y2="252" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="740" y1="224" x2="800" y2="252" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="420" y="254" width="210" height="58" rx="8" fill="#fff" stroke="#555"/>
    <text x="525" y="275" text-anchor="middle" font-weight="bold">≤ 4 (unlikely)</text>
    <text x="525" y="295" text-anchor="middle">→ D-dimer</text>
    <rect x="690" y="254" width="180" height="58" rx="8" fill="#fff" stroke="#555"/>
    <text x="780" y="275" text-anchor="middle" font-weight="bold">&gt; 4 (likely)</text>
    <text x="780" y="295" text-anchor="middle">→ straight to CTPA</text>
    <line x1="470" y1="312" x2="430" y2="342" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="580" y1="312" x2="700" y2="342" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="780" y1="312" x2="760" y2="342" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="300" y="344" width="230" height="46" rx="8" fill="#f2f2f2" stroke="#999"/>
    <text x="415" y="364" text-anchor="middle">≤ 500 ng/mL →</text>
    <text x="415" y="381" text-anchor="middle" font-weight="bold">PE ruled out</text>
    <rect x="600" y="344" width="270" height="46" rx="8" fill="#dde8f3" stroke="#0b3d6b"/>
    <text x="735" y="364" text-anchor="middle">&gt; 500 or Wells &gt; 4 → <tspan font-weight="bold">CTPA</tspan></text>
    <text x="735" y="381" text-anchor="middle" font-size="11">renal failure / contrast allergy / ↑T4 → V/Q</text>
    <line x1="735" y1="390" x2="735" y2="412" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="420" y="414" width="450" height="84" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="645" y="434" text-anchor="middle">Negative → ruled out · Inconclusive → leg duplex</text>
    <text x="645" y="455" text-anchor="middle" font-weight="bold" fill="#2e7d32">Positive → ANTICOAGULATE ≥ 3 months</text>
    <text x="645" y="474" text-anchor="middle" font-size="10.5">DOAC (not in liver disease) · large clot → heparin/fondaparinux</text>
    <text x="645" y="490" text-anchor="middle" font-size="10">warfarin &amp; dabigatran need ≥ 5 d heparin first · can't anticoagulate → IVC filter</text>
    <rect x="30" y="300" width="250" height="198" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="155" y="322" text-anchor="middle" font-weight="bold">Supporting clues</text>
    <text x="42" y="346">• CXR usually normal</text>
    <text x="42" y="368">• ECG: sinus tachycardia</text>
    <text x="54" y="385">(S1Q3T3 rare)</text>
    <text x="42" y="407">• ABG: ↓PaO₂ ↓PaCO₂</text>
    <text x="54" y="424">resp. alkalosis ↑A-a</text>
    <text x="42" y="446">• Lungs clear + hypoxia</text>
    <text x="42" y="468">• ↑ troponin / BNP =</text>
    <text x="54" y="485">RV strain</text>
  </g>
</svg>
