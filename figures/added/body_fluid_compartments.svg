<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Body water in a 70-kg adult male: the 60–40–20 rule and how each is measured</text>
  <g font-size="12.5">
    <rect x="40" y="50" width="820" height="46" rx="8" fill="#0b3d6b"/>
    <text x="450" y="71" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">TOTAL BODY WATER ≈ 42 L = 60% of body weight</text>
    <text x="450" y="88" text-anchor="middle" fill="#dde8f3" font-size="11.5">measure with D₂O (heavy water) or antipyrine (enter all compartments)</text>
    <rect x="40" y="106" width="540" height="150" rx="8" fill="#fbe3d3" stroke="#d9822b"/>
    <text x="310" y="132" text-anchor="middle" font-weight="bold" font-size="14">ICF ≈ 28 L = 40% (⅔ of TBW)</text>
    <text x="310" y="156" text-anchor="middle">Main cation <tspan font-weight="bold">K⁺ 140</tspan> · anions <tspan font-weight="bold">phosphate 75</tspan>, protein</text>
    <text x="310" y="178" text-anchor="middle">Na⁺ only 14 · Cl⁻ only 3 · Ca²⁺ ~0.0001 mmol/L</text>
    <rect x="160" y="196" width="300" height="46" rx="7" fill="#fff" stroke="#b3261e" stroke-dasharray="5,3"/>
    <text x="310" y="215" text-anchor="middle" font-weight="bold" fill="#b3261e">Cannot be measured directly</text>
    <text x="310" y="233" text-anchor="middle">ICF = TBW − ECF</text>
    <rect x="590" y="106" width="270" height="150" rx="8" fill="#dde8f3" stroke="#0b3d6b"/>
    <text x="725" y="132" text-anchor="middle" font-weight="bold" font-size="14">ECF ≈ 14 L = 20% (⅓)</text>
    <text x="725" y="156" text-anchor="middle">Main cation <tspan font-weight="bold">Na⁺ 140–145</tspan></text>
    <text x="725" y="176" text-anchor="middle">anions <tspan font-weight="bold">Cl⁻</tspan>, <tspan font-weight="bold">HCO₃⁻</tspan></text>
    <text x="725" y="204" text-anchor="middle">measure: <tspan font-weight="bold">inulin</tspan> or</text>
    <text x="725" y="222" text-anchor="middle"><tspan font-weight="bold">Na thiocyanate</tspan> (don't enter cells)</text>
    <rect x="590" y="266" width="130" height="100" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="655" y="288" text-anchor="middle" font-weight="bold">Plasma (IVF)</text>
    <text x="655" y="306" text-anchor="middle">≈ 3 L = 5%</text>
    <text x="655" y="328" text-anchor="middle" font-size="11">Evans blue /</text>
    <text x="655" y="344" text-anchor="middle" font-size="11">RISA (¹³¹I-albumin)</text>
    <rect x="730" y="266" width="130" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="795" y="288" text-anchor="middle" font-weight="bold">ISF (EVF)</text>
    <text x="795" y="306" text-anchor="middle">≈ 11 L = 15%</text>
    <text x="795" y="328" text-anchor="middle" font-size="11" fill="#b3261e" font-weight="bold">calculated only:</text>
    <text x="795" y="344" text-anchor="middle" font-size="11">ECF − plasma</text>
    <text x="725" y="382" text-anchor="middle" font-size="11" fill="#555">lymph bridges ISF ↔ plasma</text>
    <rect x="40" y="266" width="540" height="130" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="310" y="288" text-anchor="middle" font-weight="bold">Same everywhere: osmolarity ≈ 290 mOsm/L</text>
    <text x="55" y="312">• Blood volume ≈ 8% of body weight (≈ 5.6 L in 70 kg) [calc. added]</text>
    <text x="55" y="334">• TBW: infants 70–75% · adult ♂ 60% · adult ♀ ~54% · obese ↓ (fat is dry)</text>
    <text x="55" y="356">• + and − charges balance in every compartment,</text>
    <text x="67" y="374">EXCEPT along cell-membrane surfaces</text>
  </g>
</svg>
