<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="900" height="560" fill="#fff"/>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">HFrEF (LVEF ≤ 40%): the four mortality pillars, then add-ons, then devices</text>
<rect x="20" y="44" width="860" height="40" rx="8" fill="#eceff1" stroke="#607d8b"/>
<text x="450" y="69" text-anchor="middle" font-size="13" fill="#263238"><tspan font-weight="bold">Everyone:</tspan> Na⁺ restriction · fluid 1.5–2 L · daily weights · exercise · vaccines · stop smoking/alcohol · avoid NSAIDs, non-DHP CCBs</text>
<rect x="20" y="98" width="205" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="122.5" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ARNI / ACEi / ARB</text>
<text x="122.5" y="137" text-anchor="middle" font-size="12" fill="#222">sacubitril–valsartan</text>
<text x="122.5" y="154" text-anchor="middle" font-size="12" fill="#222">(or enalapril, ramipril;</text>
<text x="122.5" y="171" text-anchor="middle" font-size="12" fill="#222">ARB if ACEi cough)</text>
<rect x="237" y="98" width="205" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="339.5" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">β-blocker</text>
<text x="339.5" y="137" text-anchor="middle" font-size="12" fill="#222">bisoprolol, carvedilol,</text>
<text x="339.5" y="154" text-anchor="middle" font-size="12" fill="#222">metoprolol succinate</text>
<text x="339.5" y="171" text-anchor="middle" font-size="12" fill="#222">start low when euvolaemic</text>
<rect x="454" y="98" width="205" height="100" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
<text x="556.5" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">MRA</text>
<text x="556.5" y="137" text-anchor="middle" font-size="12" fill="#222">spironolactone,</text>
<text x="556.5" y="154" text-anchor="middle" font-size="12" fill="#222">eplerenone</text>
<text x="556.5" y="171" text-anchor="middle" font-size="12" fill="#222">NYHA II–IV, EF ≤ 35%; K⁺</text>
<rect x="671" y="98" width="205" height="100" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="773.5" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SGLT2 inhibitor</text>
<text x="773.5" y="137" text-anchor="middle" font-size="12" fill="#222">dapagliflozin,</text>
<text x="773.5" y="154" text-anchor="middle" font-size="12" fill="#222">empagliflozin</text>
<text x="773.5" y="171" text-anchor="middle" font-size="12" fill="#222">NYHA II–IV (± diabetes)</text>
<text x="450" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">All four ↓ MORTALITY · loop diuretic for congestion = symptoms only (no mortality benefit)</text>
<line x1="450" y1="226" x2="450" y2="250" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="460" y="243" font-size="12" fill="#333">still symptomatic after 3 months of GDMT?</text>
<rect x="20" y="254" width="280" height="78" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="160.0" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Hydralazine + ISDN</text>
<text x="160.0" y="293" text-anchor="middle" font-size="12" fill="#222">Black patients, or ACEi/ARB/ARNI</text>
<text x="160.0" y="310" text-anchor="middle" font-size="12" fill="#222">intolerant → mortality benefit</text>
<rect x="310" y="254" width="280" height="78" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="450.0" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Ivabradine</text>
<text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">sinus HR ≥ 70 on max β-blocker,</text>
<text x="450.0" y="310" text-anchor="middle" font-size="12" fill="#222">NYHA II–III, EF ≤ 35%</text>
<rect x="600" y="254" width="280" height="78" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
<text x="740.0" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Digoxin</text>
<text x="740.0" y="293" text-anchor="middle" font-size="12" fill="#222">persistent symptoms →</text>
<text x="740.0" y="310" text-anchor="middle" font-size="12" fill="#222">↓ hospitalisation (not mortality)</text>
<line x1="450" y1="336" x2="450" y2="358" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="362" width="280" height="96" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text x="160.0" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ICD (primary prevention)</text>
<text x="160.0" y="401" text-anchor="middle" font-size="12" fill="#222">GDMT ≥ 3 mo + LVEF ≤ 35%</text>
<text x="160.0" y="418" text-anchor="middle" font-size="12" fill="#222">+ NYHA II–III</text>
<text x="160.0" y="435" text-anchor="middle" font-size="12" fill="#222">(secondary: survived VF/VT)</text>
<rect x="310" y="362" width="280" height="96" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text x="450.0" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">CRT</text>
<text x="450.0" y="401" text-anchor="middle" font-size="12" fill="#222">GDMT ≥ 3 mo + LVEF ≤ 35%</text>
<text x="450.0" y="418" text-anchor="middle" font-size="12" fill="#222">+ QRS ≥ 150 ms with LBBB</text>
<text x="450.0" y="435" text-anchor="middle" font-size="12" fill="#222">(often CRT-D)</text>
<rect x="600" y="362" width="280" height="96" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text x="740.0" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Advanced HF (Stage D)</text>
<text x="740.0" y="401" text-anchor="middle" font-size="12" fill="#222">inotropes, LVAD bridge,</text>
<text x="740.0" y="418" text-anchor="middle" font-size="12" fill="#222">heart TRANSPLANT (only cure)</text>
<text x="740.0" y="435" text-anchor="middle" font-size="12" fill="#222">or palliative care</text>
<rect x="20" y="472" width="860" height="74" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
<text x="450" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">HFpEF (EF ≥ 50%): no proven mortality therapy → diuretics for congestion, rate/BP/ischaemia control</text>
<text x="450" y="518" text-anchor="middle" font-size="12.5" fill="#0d47a1">[added] SGLT2i (EMPEROR-Preserved, DELIVER) ↓ HF hospitalisation; treat HTN, AF, obesity</text>
<text x="450" y="538" text-anchor="middle" font-size="12.5" fill="#0d47a1">ACC/AHA stages A→D (at risk → structural → symptomatic → refractory) ≠ NYHA I–IV (symptom severity)</text>
</svg>