<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="440" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Transport across the cell membrane: one map</text>
  <g font-size="12">
    <rect x="20" y="45" width="420" height="30" rx="6" fill="#2e7d32"/><text x="230" y="65" text-anchor="middle" fill="#fff" font-weight="bold">PASSIVE (with gradient, no ATP), small molecules</text>
    <rect x="450" y="45" width="210" height="30" rx="6" fill="#b3261e"/><text x="555" y="65" text-anchor="middle" fill="#fff" font-weight="bold">ACTIVE (against gradient)</text>
    <rect x="670" y="45" width="210" height="30" rx="6" fill="#6a1b9a"/><text x="775" y="65" text-anchor="middle" fill="#fff" font-weight="bold">VESICULAR (large)</text>
    <rect x="20" y="85" width="135" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="87" y="105" text-anchor="middle" font-weight="bold">Simple</text>
    <text x="28" y="126">No carrier</text><text x="28" y="146">• Lipid bilayer:</text><text x="36" y="162" font-size="11">O₂, N₂, CO₂ ∝</text><text x="36" y="176" font-size="11">lipid solubility</text>
    <text x="28" y="196">• Channels:</text><text x="36" y="212" font-size="11">leak or gated</text><text x="36" y="226" font-size="11">(voltage, mechanical,</text><text x="36" y="240" font-size="11">ligand, phospho)</text>
    <text x="28" y="264" font-size="11">Linear with</text><text x="28" y="278" font-size="11">gradient,</text><text x="28" y="292" font-size="11">no maximum</text>
    <rect x="163" y="85" width="135" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="230" y="105" text-anchor="middle" font-weight="bold">Facilitated</text>
    <text x="171" y="126">Carrier protein</text><text x="171" y="146">e.g. glucose</text><text x="171" y="166">(GLUT)</text>
    <text x="171" y="190">• Specific</text><text x="171" y="208">• Competition</text><text x="179" y="222" font-size="11">(glucose/galactose)</text>
    <text x="171" y="244">• Saturates (Vmax)</text><text x="171" y="264">• More temp-</text><text x="179" y="278">sensitive</text>
    <rect x="306" y="85" width="134" height="230" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="373" y="105" text-anchor="middle" font-weight="bold">Osmosis</text>
    <text x="314" y="126">Water moves</text><text x="314" y="144">toward higher</text><text x="314" y="162">solute conc.</text>
    <text x="314" y="186">Pressure depends</text><text x="314" y="202">on NUMBER of</text><text x="314" y="218">particles, not mass</text>
    <text x="314" y="242">Plasma 290</text><text x="314" y="258">mOsm/L</text><text x="314" y="274">= 5597 mmHg</text>
    <rect x="450" y="85" width="102" height="230" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="501" y="105" text-anchor="middle" font-weight="bold">Primary</text>
    <text x="456" y="126">ATP used</text><text x="456" y="144">directly</text>
    <text x="456" y="168" font-weight="bold">Na⁺/K⁺</text><text x="456" y="184" font-weight="bold">ATPase</text>
    <text x="456" y="206">3 Na⁺ out</text><text x="456" y="222">2 K⁺ in</text>
    <text x="456" y="246">ouabain /</text><text x="456" y="262">digoxin block</text>
    <rect x="558" y="85" width="102" height="230" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="609" y="105" text-anchor="middle" font-weight="bold">Secondary</text>
    <text x="564" y="126">Uses the Na⁺</text><text x="564" y="144">gradient made</text><text x="564" y="162">by primary</text>
    <text x="564" y="186" font-weight="bold">SGLT1/2:</text><text x="564" y="202">Na⁺ + glucose</text><text x="564" y="218">in (symport)</text>
    <text x="564" y="242">then glucose</text><text x="564" y="258">out via GLUT</text><text x="564" y="274">(facilitated)</text>
    <rect x="670" y="85" width="102" height="230" rx="8" fill="#ede7f6" stroke="#6a1b9a"/>
    <text x="721" y="105" text-anchor="middle" font-weight="bold">Endocytosis</text>
    <text x="676" y="126">IN</text>
    <text x="676" y="150" font-weight="bold">Pinocytosis</text><text x="676" y="166">cell drinking:</text><text x="676" y="182">proteins, ECF</text>
    <text x="676" y="206" font-weight="bold">Phagocytosis</text><text x="676" y="222">cell eating:</text><text x="676" y="238">bacteria, debris</text><text x="676" y="254">(some WBCs)</text>
    <rect x="778" y="85" width="102" height="230" rx="8" fill="#ede7f6" stroke="#6a1b9a"/>
    <text x="829" y="105" text-anchor="middle" font-weight="bold">Exocytosis</text>
    <text x="784" y="126">OUT</text>
    <text x="784" y="150">Balance with</text><text x="784" y="166">endocytosis</text><text x="784" y="182">keeps area</text><text x="784" y="198">constant</text>
    <rect x="20" y="330" width="860" height="94" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="450" y="352" text-anchor="middle" font-weight="bold">Simple diffusion rate ∝ (ΔC × surface area × temperature) ÷ (distance × √molecular weight)</text>
    <text x="450" y="376" text-anchor="middle">Carrier direction: uniport (1 substance, e.g. Ca²⁺ pump) · symport (same direction, Na⁺ + glucose) · antiport (opposite, Na⁺/K⁺)</text>
    <text x="450" y="400" text-anchor="middle">Active transport energy ∝ log ΔC · Na⁺/K⁺ pump uses 24% of cell energy, 70% in neurons, 90% in kidney</text>
  </g>
</svg>
