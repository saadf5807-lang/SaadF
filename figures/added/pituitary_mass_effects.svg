<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Pituitary adenoma: which way it grows decides the signs</text>
  <g font-size="12">
    <ellipse cx="450" cy="235" rx="95" ry="70" fill="#f8bbd0" stroke="#b3261e" stroke-width="2"/>
    <text x="450" y="225" text-anchor="middle" font-weight="bold" fill="#b3261e">ADENOMA</text>
    <text x="450" y="243" text-anchor="middle" font-size="11">in sella turcica</text>
    <text x="450" y="259" text-anchor="middle" font-size="10.5">micro &lt; 10 mm · macro ≥ 10 mm</text>
    <line x1="450" y1="165" x2="450" y2="120" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="545" y1="235" x2="615" y2="235" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="355" y1="235" x2="285" y2="235" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="305" x2="450" y2="345" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="250" y="44" width="400" height="74" rx="8" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="450" y="63" text-anchor="middle" font-weight="bold" fill="#2b6cb0">SUPERIOR → optic chiasm + hypothalamus</text>
    <text x="262" y="83">⭐ Bitemporal hemianopia, ↓ visual acuity</text>
    <text x="262" y="101">Hypothalamic: DI, SIADH, thirst/temp/appetite/sleep</text>
    <text x="262" y="114" font-size="10.5" fill="#555">Stalk compression → "disconnection" ↑ prolactin</text>
    <rect x="620" y="175" width="265" height="120" rx="8" fill="#fff3e0" stroke="#e65100"/>
    <text x="752" y="195" text-anchor="middle" font-weight="bold" fill="#e65100">LATERAL → cavernous sinus</text>
    <text x="632" y="216">CN III, IV, VI → diplopia, ptosis</text>
    <text x="632" y="234">CN V1 → facial pain</text>
    <text x="632" y="252">Temporal lobe dysfunction</text>
    <text x="632" y="276" font-size="10.5" fill="#555">(ICA runs through the sinus)</text>
    <rect x="15" y="175" width="265" height="120" rx="8" fill="#ede7f6" stroke="#4527a0"/>
    <text x="147" y="195" text-anchor="middle" font-weight="bold" fill="#4527a0">HEADACHE (any direction)</text>
    <text x="27" y="216">Bitemporal (dura stretched)</text>
    <text x="27" y="234">Eases when clinoid eroded</text>
    <text x="27" y="252">Late: occipital + ↑ ICP</text>
    <text x="27" y="276" font-size="10.5" fill="#555">Posterior: bilateral pyramidal (Δ) signs</text>
    <rect x="250" y="347" width="400" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="450" y="366" text-anchor="middle" font-weight="bold" fill="#2e7d32">INFERIOR → sphenoid sinus</text>
    <text x="450" y="386" text-anchor="middle">Nasopharyngeal mass · CSF rhinorrhoea</text>
    <rect x="15" y="413" width="870" height="48" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="27" y="433" font-weight="bold">Endocrine side:</text>
    <text x="135" y="433">EXCESS (PRL 35% · non-functioning 30% · GH 20% · PRL+GH 10% · TSH/LH/FSH/ACTH 5%)</text>
    <text x="27" y="452">+ DEFICIENCY (compressed normal gland: GH → LH/FSH → TSH → ACTH) · sudden bleed = APOPLEXY</text>
  </g>
</svg>
