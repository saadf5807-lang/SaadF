<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">CAP: score it (CURB-65) → place it → treat it</text>
  <g font-size="12">
    <rect x="20" y="44" width="300" height="200" rx="8" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="170" y="64" text-anchor="middle" font-weight="bold" fill="#2b6cb0">CURB-65 (1 point each)</text>
    <text x="32" y="88"><tspan font-weight="bold">C</tspan>onfusion (new)</text>
    <text x="32" y="110"><tspan font-weight="bold">U</tspan>rea &gt; 7 mmol/L (BUN &gt; 19–20 mg/dL)</text>
    <text x="32" y="132"><tspan font-weight="bold">R</tspan>R ≥ 30/min</text>
    <text x="32" y="154"><tspan font-weight="bold">B</tspan>P: SBP &lt; 90 or DBP ≤ 60</text>
    <text x="32" y="176">Age ≥ <tspan font-weight="bold">65</tspan></text>
    <text x="32" y="204" font-size="11" fill="#555">CRB-65 (no urea) for the community.</text>
    <text x="32" y="222" font-size="11" fill="#555">Also: SpO₂, comorbidity, social factors.</text>
    <line x1="320" y1="144" x2="358" y2="144" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="360" y="44" width="160" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="440" y="66" text-anchor="middle" font-weight="bold" fill="#2e7d32">0–1</text>
    <text x="440" y="84" text-anchor="middle">OUTPATIENT</text>
    <text x="440" y="99" text-anchor="middle" font-size="10.5">mortality ≈ 1–3%</text>
    <rect x="360" y="114" width="160" height="62" rx="8" fill="#fff8e1" stroke="#8a6d00"/>
    <text x="440" y="136" text-anchor="middle" font-weight="bold" fill="#8a6d00">2</text>
    <text x="440" y="154" text-anchor="middle">ADMIT (ward)</text>
    <text x="440" y="169" text-anchor="middle" font-size="10.5">mortality ≈ 9%</text>
    <rect x="360" y="184" width="160" height="62" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="440" y="206" text-anchor="middle" font-weight="bold" fill="#b3261e">≥ 3 (4–5)</text>
    <text x="440" y="224" text-anchor="middle">ADMIT; consider ICU</text>
    <text x="440" y="239" text-anchor="middle" font-size="10.5">mortality 15–40%</text>
    <line x1="520" y1="75" x2="548" y2="75" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="520" y1="145" x2="548" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="520" y1="215" x2="548" y2="215" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="550" y="44" width="330" height="62" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="560" y="62" font-weight="bold">No comorbidity:</text>
    <text x="560" y="78">amoxicillin OR doxycycline OR macrolide*</text>
    <text x="560" y="96" font-weight="bold">Comorbid:</text><text x="640" y="96">amox-clav + macrolide, OR FQ</text>
    <rect x="550" y="114" width="330" height="62" rx="8" fill="#fff" stroke="#8a6d00"/>
    <text x="560" y="134" font-weight="bold">β-lactam IV + macrolide</text>
    <text x="560" y="151">(ceftriaxone/cefotaxime/amp-sulbactam</text>
    <text x="560" y="167">+ azithromycin) OR resp. FQ alone</text>
    <rect x="550" y="184" width="330" height="62" rx="8" fill="#fff" stroke="#b3261e"/>
    <text x="560" y="204" font-weight="bold">β-lactam + macrolide OR β-lactam + FQ</text>
    <text x="560" y="221">+ MRSA cover (vanc/linezolid) / Pseudomonas</text>
    <text x="560" y="237">cover (pip-tazo, cefepime) only if risk factors</text>
    <rect x="20" y="262" width="860" height="104" rx="8" fill="#ede7f6" stroke="#4527a0"/>
    <text x="450" y="282" text-anchor="middle" font-weight="bold" fill="#4527a0">ICU: 1 major OR ≥ 3 minor (IDSA/ATS 2019)</text>
    <text x="32" y="304"><tspan font-weight="bold">Major:</tspan> septic shock needing vasopressors · respiratory failure needing mechanical ventilation</text>
    <text x="32" y="326"><tspan font-weight="bold">Minor:</tspan> RR ≥ 30 · PaO₂/FiO₂ ≤ 250 · multilobar infiltrates · confusion · BUN ≥ 20 mg/dL · WBC &lt; 4000</text>
    <text x="32" y="346">platelets &lt; 100 000 · temperature &lt; 36 °C · hypotension needing aggressive fluids</text>
    <rect x="20" y="380" width="860" height="128" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="450" y="400" text-anchor="middle" font-weight="bold" fill="#b3261e">HAP (&gt; 48 h after admission) / VAP (&gt; 48 h after intubation)</text>
    <text x="32" y="424"><tspan font-weight="bold">MDR risk:</tspan> IV antibiotics in past 90 days · septic shock · ARDS before VAP · ≥ 5 days in hospital before onset · dialysis</text>
    <text x="32" y="446"><tspan font-weight="bold">No MDR risk, low mortality risk:</tspan> ONE anti-pseudomonal β-lactam (pip-tazo, cefepime, levofloxacin, imipenem, meropenem)</text>
    <text x="32" y="468"><tspan font-weight="bold">MDR risk or high mortality:</tspan> TWO anti-pseudomonals (β-lactam + FQ/aminoglycoside) ± MRSA cover</text>
    <text x="32" y="488">(vancomycin or linezolid) = "dual/triple" therapy · avoid two β-lactams</text>
  </g>
  <text x="890" y="514" text-anchor="end" font-size="9.5" fill="#555">* macrolide monotherapy only where pneumococcal macrolide resistance &lt; 25%. Whole diagram [added]: rebuilt because the slide tables are images.</text>
</svg>
