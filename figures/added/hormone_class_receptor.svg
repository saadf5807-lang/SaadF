<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="380" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Hormone chemistry decides where the receptor is</text>
  <g font-size="12.5">
    <rect x="20" y="50" width="270" height="250" rx="10" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="155" y="74" text-anchor="middle" font-weight="bold" font-size="14" fill="#2b6cb0">Protein / peptide</text>
    <text x="32" y="98">Pituitary hormones, insulin,</text><text x="32" y="116">glucagon, somatostatin, PTH</text>
    <text x="155" y="150" text-anchor="middle" font-weight="bold" font-size="14" fill="#b3261e">+ Catecholamines</text>
    <text x="155" y="168" text-anchor="middle" font-size="11">(tyrosine-derived: adrenaline, NA, dopamine)</text>
    <rect x="40" y="186" width="230" height="44" rx="7" fill="#fff" stroke="#2b6cb0"/>
    <text x="155" y="206" text-anchor="middle" font-weight="bold">Receptor: CELL MEMBRANE</text>
    <text x="155" y="222" text-anchor="middle" font-size="11">water-soluble, can't cross membrane [added]</text>
    <text x="32" y="254">→ 2nd messengers (e.g., cAMP),</text><text x="32" y="272">channels, G-protein, enzymes</text>
    <rect x="315" y="50" width="270" height="250" rx="10" fill="#fff7e8" stroke="#d9822b"/>
    <text x="450" y="74" text-anchor="middle" font-weight="bold" font-size="14" fill="#d9822b">Steroid</text>
    <text x="327" y="98">Adrenal cortex: cortisol,</text><text x="327" y="116">aldosterone, androgens</text>
    <text x="327" y="134">Ovary/placenta: oestrogen,</text><text x="327" y="152">progesterone · Testis: testosterone</text>
    <rect x="335" y="186" width="230" height="44" rx="7" fill="#fff" stroke="#d9822b"/>
    <text x="450" y="206" text-anchor="middle" font-weight="bold">Receptor: CYTOPLASM</text>
    <text x="450" y="222" text-anchor="middle" font-size="11">lipid-soluble, crosses membrane [added]</text>
    <text x="327" y="254">→ complex enters nucleus →</text><text x="327" y="272">transcription (new protein)</text>
    <rect x="610" y="50" width="270" height="250" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="745" y="74" text-anchor="middle" font-weight="bold" font-size="14" fill="#2e7d32">Thyroid (T4, T3)</text>
    <text x="622" y="98">Tyrosine derivative,</text><text x="622" y="116">but behaves like a steroid</text><text x="622" y="134">(lipid-soluble) [added]</text>
    <rect x="630" y="186" width="230" height="44" rx="7" fill="#fff" stroke="#2e7d32"/>
    <text x="745" y="206" text-anchor="middle" font-weight="bold">Receptor: NUCLEUS</text>
    <text x="745" y="222" text-anchor="middle" font-size="11">bound to chromosomes</text>
    <text x="622" y="254">→ transcription modulation</text>
    <rect x="20" y="314" width="860" height="50" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="450" y="336" text-anchor="middle" font-weight="bold">Trap: tyrosine derivatives split. Catecholamines → membrane; thyroid hormones → nucleus.</text>
    <text x="450" y="354" text-anchor="middle" font-size="11.5">Cells without a receptor for the hormone are "silent" (no response).</text>
  </g>
</svg>
