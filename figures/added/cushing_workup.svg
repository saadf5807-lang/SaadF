<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Cushing's: confirm → is it ACTH-driven? → where is the source?</text>
  <g font-size="12">
    <rect x="120" y="42" width="660" height="56" rx="8" fill="#0b3d6b"/>
    <text x="450" y="62" text-anchor="middle" fill="#fff" font-weight="bold">1. CONFIRM hypercortisolism (exclude exogenous steroids first)</text>
    <text x="450" y="80" text-anchor="middle" fill="#dde8f3" font-size="11">24-h urinary free cortisol · overnight 1 mg dexamethasone (8 am cortisol &lt; 7 µg/dL excludes)</text>
    <text x="450" y="92" text-anchor="middle" fill="#dde8f3" font-size="11">loss of diurnal rhythm / late-night cortisol</text>
    <line x1="450" y1="96" x2="450" y2="120" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="300" y="122" width="300" height="36" rx="8" fill="#fff" stroke="#333"/>
    <text x="450" y="145" text-anchor="middle" font-weight="bold">2. Plasma ACTH</text>
    <line x1="350" y1="158" x2="160" y2="186" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="550" y1="158" x2="700" y2="186" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="20" y="188" width="300" height="122" rx="8" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="170" y="208" text-anchor="middle" font-weight="bold" fill="#2b6cb0">LOW / absent ACTH</text>
    <text x="170" y="226" text-anchor="middle" font-weight="bold">= ADRENAL Cushing (20%)</text>
    <text x="32" y="250">→ CT / MRI adrenals</text>
    <text x="32" y="270">Adenoma → adrenalectomy</text>
    <text x="32" y="290">Carcinoma (virilisation, children) →</text>
    <text x="32" y="305">metyrapone pre-op, mitotane post-op</text>
    <rect x="360" y="188" width="520" height="122" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="620" y="208" text-anchor="middle" font-weight="bold" fill="#b3261e">HIGH ACTH = ACTH-dependent</text>
    <text x="372" y="232" font-weight="bold">3. High-dose dexamethasone (2 mg 6-hourly × 2 days)</text>
    <text x="372" y="252">± pituitary MRI · inferior petrosal sinus sampling if MRI equivocal*</text>
    <text x="372" y="276"><tspan font-weight="bold" fill="#2e7d32">Suppresses ≥ 50%</tspan> → PITUITARY (Cushing disease, 75%)</text>
    <text x="372" y="296"><tspan font-weight="bold" fill="#b3261e">No suppression, VERY high ACTH</tspan> → ECTOPIC (lung carcinoid/SCLC)</text>
    <line x1="500" y1="310" x2="300" y2="340" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="740" y1="310" x2="740" y2="340" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="20" y="342" width="500" height="114" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="270" y="362" text-anchor="middle" font-weight="bold" fill="#2e7d32">PITUITARY → trans-sphenoidal surgery (85% remission)</text>
    <text x="32" y="384">Then irradiation if needed · cortisone for life after treatment</text>
    <text x="32" y="404">Medical: ↓ACTH (bromocriptine, cyproheptadine, valproate)</text>
    <text x="32" y="424">or ↓steroidogenesis (metyrapone, ketoconazole)</text>
    <text x="32" y="446" font-size="11" fill="#b3261e">Bilateral adrenalectomy → risk of NELSON syndrome (pigmentation + growing adenoma)</text>
    <rect x="540" y="342" width="340" height="114" rx="8" fill="#fff3e0" stroke="#e65100"/>
    <text x="710" y="362" text-anchor="middle" font-weight="bold" fill="#e65100">ECTOPIC → find the tumour</text>
    <text x="552" y="384">CXR / CT chest (smoker, rapid onset)</text>
    <text x="552" y="404">Hypokalaemic alkalosis, myopathy,</text>
    <text x="552" y="424">pigmentation, few cushingoid features</text>
    <text x="552" y="446">→ resect · or metyrapone ± mitotane</text>
  </g>
  <text x="890" y="466" text-anchor="end" font-size="9.5" fill="#555">* added detail (modern practice: MRI first in ACTH-dependent disease; IPSS gold standard)</text>
</svg>
