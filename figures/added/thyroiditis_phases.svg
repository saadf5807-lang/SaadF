<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="330" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Subacute (de Quervain) thyroiditis: the three-phase course</text>
  <g font-size="12">
    <rect x="60" y="50" width="260" height="70" fill="#fdecea"/><rect x="320" y="50" width="260" height="70" fill="#e3f2fd"/><rect x="580" y="50" width="280" height="70" fill="#e8f5e9"/>
    <rect x="60" y="120" width="800" height="100" fill="#fafafa"/>
    <line x1="60" y1="170" x2="820" y2="170" stroke="#999" stroke-dasharray="5,4"/>
    <text x="824" y="174" font-size="10.5" fill="#666">normal</text>
    <path d="M60,170 C110,170 125,126 190,126 C255,126 280,170 320,190 C360,210 420,215 470,205 C530,195 560,175 600,170 L815,170" fill="none" stroke="#0b3d6b" stroke-width="3.5"/>
    <text x="30" y="100" font-size="11" fill="#555" transform="rotate(-90 30 100)">FT4</text>
    <text x="190" y="75" text-anchor="middle" font-weight="bold" fill="#b3261e">1. THYROTOXIC</text>
    <text x="450" y="75" text-anchor="middle" font-weight="bold" fill="#2b6cb0">2. HYPO / EUTHYROID</text>
    <text x="720" y="75" text-anchor="middle" font-weight="bold" fill="#2e7d32">3. RECOVERY</text>
    <text x="190" y="95" text-anchor="middle" font-size="11">stored hormone leaks out</text>
    <text x="450" y="95" text-anchor="middle" font-size="11">stores depleted</text>
    <text x="720" y="95" text-anchor="middle" font-size="11">gland regenerates → normal</text>
    <text x="70" y="244" font-weight="bold">Clue:</text>
    <text x="115" y="244">after a viral URTI → PAINFUL tender thyroid (pain referred to jaw/ear/occiput), fever, dysphagia</text>
    <text x="70" y="266" font-weight="bold">Labs:</text>
    <text x="115" y="266">↑ T4 · <tspan font-weight="bold">↓ RAIU</tspan> · <tspan font-weight="bold">↑ ESR</tspan></text>
    <text x="70" y="288" font-weight="bold">Treat:</text>
    <text x="115" y="288">mild → aspirin · severe → prednisone 15–20 mg tid + propranolol for thyrotoxic symptoms</text>
    <text x="70" y="310" font-weight="bold" fill="#b3261e">NOT:</text>
    <text x="115" y="310">antithyroid drugs (nothing is being over-synthesised)</text>
  </g>
</svg>
