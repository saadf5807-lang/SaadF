<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Arial, Helvetica, sans-serif">
<rect width="880" height="470" fill="#fff"/>
<text x="440" y="28" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="bold">Dengue: the danger comes as the fever falls</text>
<rect x="90.0" y="45" width="228.0" height="250" fill="#fdf3e3"/>
<text x="204.0" y="65" font-size="14" text-anchor="middle" fill="#1b2733" font-weight="bold">FEBRILE</text>
<text x="204.0" y="82" font-size="12" text-anchor="middle" fill="#1b2733">days 1–3</text>
<rect x="318.0" y="45" width="228.0" height="250" fill="#fdecea"/>
<text x="432.0" y="65" font-size="14" text-anchor="middle" fill="#1b2733" font-weight="bold">CRITICAL</text>
<text x="432.0" y="82" font-size="12" text-anchor="middle" fill="#1b2733">around defervescence</text>
<rect x="546.0" y="45" width="304.0" height="250" fill="#e9f7ef"/>
<text x="698.0" y="65" font-size="14" text-anchor="middle" fill="#1b2733" font-weight="bold">RECOVERY</text>
<text x="698.0" y="82" font-size="12" text-anchor="middle" fill="#1b2733">fluid reabsorption</text>
<line x1="90" y1="295" x2="850" y2="295" stroke="#333"/>
<line x1="90.0" y1="295" x2="90.0" y2="300" stroke="#333"/>
<text x="90.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">0</text>
<line x1="166.0" y1="295" x2="166.0" y2="300" stroke="#333"/>
<text x="166.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">1</text>
<line x1="242.0" y1="295" x2="242.0" y2="300" stroke="#333"/>
<text x="242.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">2</text>
<line x1="318.0" y1="295" x2="318.0" y2="300" stroke="#333"/>
<text x="318.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">3</text>
<line x1="394.0" y1="295" x2="394.0" y2="300" stroke="#333"/>
<text x="394.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">4</text>
<line x1="470.0" y1="295" x2="470.0" y2="300" stroke="#333"/>
<text x="470.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">5</text>
<line x1="546.0" y1="295" x2="546.0" y2="300" stroke="#333"/>
<text x="546.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">6</text>
<line x1="622.0" y1="295" x2="622.0" y2="300" stroke="#333"/>
<text x="622.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">7</text>
<line x1="698.0" y1="295" x2="698.0" y2="300" stroke="#333"/>
<text x="698.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">8</text>
<line x1="774.0" y1="295" x2="774.0" y2="300" stroke="#333"/>
<text x="774.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">9</text>
<line x1="850.0" y1="295" x2="850.0" y2="300" stroke="#333"/>
<text x="850.0" y="315" font-size="12" text-anchor="middle" fill="#1b2733">10</text>
<text x="40" y="315" font-size="12" text-anchor="middle" fill="#1b2733" font-weight="bold">Day</text>
<path d="M90,250 L128,110 L204,100 L280,110 L341,220 L394,250 L850,255" fill="none" stroke="#c0392b" stroke-width="3.5" />
<path d="M90,200 L318,195 L394,140 L470,125 L546,160 L622,200 L850,205" fill="none" stroke="#2e86c1" stroke-width="3.5" stroke-dasharray="8 5"/>
<path d="M90,130 L242,160 L318,200 L394,250 L470,265 L546,240 L622,190 L850,140" fill="none" stroke="#7d3c98" stroke-width="3.5" stroke-dasharray="2 5"/>
<text x="204.0" y="135" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">Temperature</text>
<text x="439.59999999999997" y="118" font-size="13" text-anchor="middle" fill="#2e86c1" font-weight="bold">Haematocrit ↑</text>
<text x="728.4" y="132" font-size="13" text-anchor="middle" fill="#7d3c98" font-weight="bold">Platelets</text>
<text x="432.0" y="285" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">leak · shock · bleeding</text>
<text x="80" y="345" font-size="13" text-anchor="end" fill="#1b2733" font-weight="bold">Confirm:</text>
<rect x="90.0" y="330" width="532.0" height="22" rx="5" fill="#d6eaf8"/>
<text x="356.0" y="346" font-size="12" text-anchor="middle" fill="#1b2733" font-weight="bold">Days 0–7: RT-PCR (NAAT) or NS1 antigen + IgM</text>
<rect x="622.0" y="330" width="228.0" height="22" rx="5" fill="#e8daef"/>
<text x="736.0" y="346" font-size="12" text-anchor="middle" fill="#1b2733" font-weight="bold">&gt; day 7: IgM</text>
<text x="90" y="378" font-size="12" text-anchor="start" fill="#1b2733">Single IgG = NOT diagnostic of acute dengue (past infection; ↑ risk of severe disease on a 2nd serotype)</text>
<text x="90" y="402" font-size="12" text-anchor="start" fill="#1b2733">Warning signs: abdominal pain · persistent vomiting · ascites/effusion · mucosal bleed · lethargy/restless · liver &gt;2 cm · ↑Hct + ↓plt</text>
<text x="90" y="426" font-size="12" text-anchor="start" fill="#1b2733">Manage: paracetamol + oral fluids (no warning signs) · titrated IV isotonic fluids, monitor Hct/UO (warning/severe)</text>
<text x="90" y="450" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">Avoid aspirin/NSAIDs · no prophylactic platelets · curves are schematic, not to scale [added]</text>
</svg>