<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="360" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Pulmonary hypertension: causes converge on the right ventricle</text>
  <g font-size="12.5">
    <rect x="20" y="50" width="205" height="150" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="122" y="72" text-anchor="middle" font-weight="bold" fill="#b3261e">Group 1: PAH</text>
    <text x="30" y="96">• Idiopathic / hereditary</text><text x="30" y="116">• Drugs: meth, appetite</text><text x="42" y="132">suppressants</text><text x="30" y="152">• CTD</text><text x="30" y="172">• Eisenmenger (CHD)</text>
    <rect x="240" y="50" width="200" height="150" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="340" y="72" text-anchor="middle" font-weight="bold" fill="#d9822b">Group 2: Left heart</text>
    <text x="250" y="96">• CHF</text><text x="250" y="116">• Mitral / aortic</text><text x="262" y="132">stenosis</text><text x="250" y="156" font-size="11" fill="#555">↑ pulmonary venous</text><text x="250" y="172" font-size="11" fill="#555">back-pressure</text>
    <rect x="455" y="50" width="200" height="150" rx="8" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="555" y="72" text-anchor="middle" font-weight="bold" fill="#2b6cb0">Group 3: Lung / hypoxia</text>
    <text x="465" y="96">• COPD (obstructive)</text><text x="465" y="116">• OSA</text><text x="465" y="136">• Restrictive disease</text><text x="465" y="160" font-size="11" fill="#555">hypoxic vasoconstriction,</text><text x="465" y="176" font-size="11" fill="#555">intimal fibrosis</text>
    <rect x="670" y="50" width="210" height="150" rx="8" fill="#ede7f6" stroke="#6a1b9a"/>
    <text x="775" y="72" text-anchor="middle" font-weight="bold" fill="#6a1b9a">Group 4: PA obstruction</text>
    <text x="680" y="96">• Chronic thrombo-</text><text x="692" y="112">embolic (CTEPH)</text><text x="680" y="136" font-size="11" fill="#555">recurrent PE → fixed</text><text x="680" y="152" font-size="11" fill="#555">obstruction</text>
    <g stroke="#333" stroke-width="2" marker-end="url(#a)"><line x1="122" y1="200" x2="380" y2="244"/><line x1="340" y1="200" x2="420" y2="242"/><line x1="555" y1="200" x2="480" y2="242"/><line x1="775" y1="200" x2="520" y2="244"/></g>
    <rect x="230" y="246" width="440" height="44" rx="8" fill="#0b3d6b"/>
    <text x="450" y="266" text-anchor="middle" font-weight="bold" fill="#fff">mPAP &gt; 20 mm Hg at rest → RV hypertrophy → RV failure</text>
    <text x="450" y="282" text-anchor="middle" font-size="11" fill="#dde8f3">loud P2 · RV heave · JVD · hepatomegaly · ascites · edema</text>
    <text x="450" y="318" text-anchor="middle" font-size="12.5">Confirm: <tspan font-weight="bold">right heart catheterization</tspan> · Treat: cause-directed (Groups 2–4) · <tspan font-weight="bold">vasoactives only for Group 1</tspan></text>
    <text x="450" y="340" text-anchor="middle" font-size="11" fill="#555">Group 5 (multifactorial) is not on the slide</text>
  </g>
</svg>
