<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Tachycardia with a pulse: stable? → QRS width → regularity</text>
  <g font-size="12">
    <rect x="300" y="42" width="300" height="34" rx="8" fill="#0b3d6b"/>
    <text x="450" y="64" text-anchor="middle" fill="#fff" font-weight="bold">HR &gt; 100 with pulse: ABC, O₂, IV, 12-lead</text>
    <line x1="450" y1="76" x2="450" y2="96" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="250" y="98" width="400" height="52" rx="8" fill="#fff" stroke="#333"/>
    <text x="450" y="118" text-anchor="middle" font-weight="bold">UNSTABLE? (any of)</text>
    <text x="450" y="138" text-anchor="middle" font-size="11">↓BP/shock · confusion · chest pain · pulm. oedema</text>
    <line x1="650" y1="124" x2="708" y2="124" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
    <text x="678" y="117" text-anchor="middle" fill="#b3261e" font-weight="bold">YES</text>
    <rect x="710" y="96" width="175" height="62" rx="8" fill="#b3261e"/>
    <text x="797" y="118" text-anchor="middle" fill="#fff" font-weight="bold">SYNCHRONISED</text>
    <text x="797" y="134" text-anchor="middle" fill="#fff" font-weight="bold">DC CARDIOVERSION</text>
    <text x="797" y="150" text-anchor="middle" fill="#fde" font-size="10.5">(pulseless VT / VF → defibrillate)</text>
    <line x1="450" y1="150" x2="450" y2="176" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <text x="465" y="168" fill="#2e7d32" font-weight="bold">STABLE</text>
    <line x1="450" y1="178" x2="230" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="178" x2="670" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="20" y="202" width="420" height="30" rx="6" fill="#2b6cb0"/><text x="230" y="222" text-anchor="middle" fill="#fff" font-weight="bold">NARROW QRS (&lt; 0.12 s): supraventricular</text>
    <rect x="460" y="202" width="420" height="30" rx="6" fill="#e65100"/><text x="670" y="222" text-anchor="middle" fill="#fff" font-weight="bold">WIDE QRS (≥ 0.12 s): VT until proven otherwise</text>
    <rect x="20" y="242" width="205" height="300" rx="8" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="122" y="262" text-anchor="middle" font-weight="bold" fill="#2b6cb0">① Narrow REGULAR</text>
    <text x="30" y="282" font-size="11">Sinus tach, AVNRT, AVRT,</text>
    <text x="30" y="297" font-size="11">flutter (2:1), atrial tach</text>
    <text x="30" y="320" font-weight="bold">1. Vagal manoeuvre</text>
    <text x="30" y="338" font-weight="bold">2. Adenosine 6 → 12 → 12</text>
    <text x="40" y="353" font-size="10.5">mg rapid IV push + flush</text>
    <text x="30" y="372">3. Verapamil / diltiazem</text>
    <text x="40" y="387" font-size="10.5">or β-blocker</text>
    <text x="30" y="408" font-size="11">Adenosine unmasks flutter</text>
    <text x="30" y="423" font-size="11">waves if not converted</text>
    <text x="30" y="446" font-size="11" font-weight="bold">Long term:</text>
    <text x="30" y="462" font-size="11">RF ablation (&gt; 98% cure)</text>
    <text x="30" y="486" font-size="11" fill="#b3261e">Sinus tach: treat the</text>
    <text x="30" y="501" font-size="11" fill="#b3261e">cause (fever, anaemia,</text>
    <text x="30" y="516" font-size="11" fill="#b3261e">thyroid, PE, pain…)</text>
    <rect x="235" y="242" width="205" height="300" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="337" y="262" text-anchor="middle" font-weight="bold" fill="#2e7d32">② Narrow IRREGULAR</text>
    <text x="245" y="282" font-size="11">AF (commonest), MAT,</text>
    <text x="245" y="297" font-size="11">flutter with variable block</text>
    <text x="245" y="320" font-weight="bold">RATE: β-blocker or</text>
    <text x="245" y="336" font-weight="bold">non-DHP CCB</text>
    <text x="245" y="353" font-size="11">2nd digoxin · 3rd amiodarone</text>
    <text x="245" y="376" font-weight="bold">RHYTHM if &lt; 48 h:</text>
    <text x="245" y="392" font-size="11">propafenone (no HF) or</text>
    <text x="245" y="407" font-size="11">IV amiodarone</text>
    <text x="245" y="430" font-weight="bold">&gt; 48 h: TEE or 3 wk</text>
    <text x="245" y="446" font-weight="bold">anticoagulation first</text>
    <text x="245" y="470" font-weight="bold" fill="#b3261e">CHA₂DS₂-VASc</text>
    <text x="245" y="486" font-size="11">≥ 2 ♂ / ≥ 3 ♀ → OAC</text>
    <text x="245" y="510" font-size="11">MAT → treat COPD/hypoxia</text>
    <rect x="460" y="242" width="205" height="300" rx="8" fill="#fff3e0" stroke="#e65100"/>
    <text x="562" y="262" text-anchor="middle" font-weight="bold" fill="#e65100">③ Wide REGULAR</text>
    <text x="470" y="282" font-size="11">Monomorphic VT;</text>
    <text x="470" y="297" font-size="11">SVT + BBB / pre-excitation</text>
    <text x="470" y="320" font-weight="bold">Assume VT</text>
    <text x="470" y="338">Amiodarone 300 mg IV</text>
    <text x="470" y="354" font-size="11">(or procainamide)</text>
    <text x="470" y="374" font-size="11">Unstable → DC 200 J</text>
    <text x="470" y="396" font-size="11">Acute MI → lidocaine</text>
    <text x="470" y="411" font-size="11">IHD → amiodarone + ICD</text>
    <text x="470" y="426" font-size="11">Normal heart → ablation</text>
    <text x="470" y="450" font-size="11">Known SVT + BBB →</text>
    <text x="470" y="465" font-size="11">adenosine as for ①</text>
    <text x="470" y="490" font-size="11" fill="#b3261e" font-weight="bold">✗ Verapamil in VT</text>
    <text x="470" y="506" font-size="11" fill="#b3261e">→ collapse</text>
    <rect x="675" y="242" width="205" height="300" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="777" y="262" text-anchor="middle" font-weight="bold" fill="#b3261e">④ Wide IRREGULAR</text>
    <text x="685" y="282" font-size="11">AF + WPW (pre-excited),</text>
    <text x="685" y="297" font-size="11">AF + BBB, polymorphic VT/TdP,</text>
    <text x="685" y="312" font-size="11">VF (pulseless)</text>
    <text x="685" y="336" font-weight="bold">Pre-excited AF:</text>
    <text x="685" y="352">DC shock or</text>
    <text x="685" y="368" font-weight="bold">IV PROCAINAMIDE</text>
    <text x="685" y="390" fill="#b3261e" font-weight="bold">✗ ABCD: Adenosine,</text>
    <text x="685" y="406" fill="#b3261e" font-weight="bold">β-blocker, CCB, Digoxin</text>
    <text x="685" y="422" font-size="11" fill="#b3261e">(+ vagal manoeuvres)</text>
    <text x="685" y="446" font-weight="bold">TdP: IV MgSO₄</text>
    <text x="685" y="462" font-size="11">(unstable → defibrillate)</text>
    <text x="685" y="486" font-size="11">AF + BBB → treat as ②</text>
    <text x="685" y="510" font-weight="bold">VF → CPR + defibrillate</text>
  </g>
</svg>
