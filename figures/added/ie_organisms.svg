<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="440" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Infective endocarditis: clue in the stem → organism → antibiotic</text>
  <g font-size="12">
    <rect x="20" y="44" width="250" height="28" fill="#0b3d6b"/><text x="145" y="63" text-anchor="middle" fill="#fff" font-weight="bold">Clue</text>
    <rect x="320" y="44" width="260" height="28" fill="#0b3d6b"/><text x="450" y="63" text-anchor="middle" fill="#fff" font-weight="bold">Organism</text>
    <rect x="630" y="44" width="250" height="28" fill="#0b3d6b"/><text x="755" y="63" text-anchor="middle" fill="#fff" font-weight="bold">Targeted treatment</text>
    <g>
      <rect x="20" y="80" width="250" height="40" rx="6" fill="#fdecea"/><text x="30" y="98">Acute, IVDU, prosthetic, pacemaker,</text><text x="30" y="113">tricuspid valve</text>
      <line x1="270" y1="100" x2="318" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="80" width="260" height="40" rx="6" fill="#fdecea" stroke="#b3261e"/><text x="450" y="105" text-anchor="middle" font-weight="bold" fill="#b3261e">Staphylococcus aureus</text>
      <line x1="580" y1="100" x2="628" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="80" width="250" height="40" rx="6" fill="#fdecea"/><text x="640" y="98">MRSA: vancomycin</text><text x="640" y="113" font-size="10.5">(MSSA: anti-staph β-lactam)*</text>
    </g>
    <g>
      <rect x="20" y="128" width="250" height="40" rx="6" fill="#e8f5e9"/><text x="30" y="146">Subacute, after DENTAL work,</text><text x="30" y="161">damaged native valve</text>
      <line x1="270" y1="148" x2="318" y2="148" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="128" width="260" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="450" y="153" text-anchor="middle" font-weight="bold" fill="#2e7d32">Viridans streptococci</text>
      <line x1="580" y1="148" x2="628" y2="148" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="128" width="250" height="40" rx="6" fill="#e8f5e9"/><text x="640" y="153">Penicillin G</text>
    </g>
    <g>
      <rect x="20" y="176" width="250" height="40" rx="6" fill="#fff3e0"/><text x="30" y="194">Infected peripheral IV line;</text><text x="30" y="209">early prosthetic (≤1 y)</text>
      <line x1="270" y1="196" x2="318" y2="196" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="176" width="260" height="40" rx="6" fill="#fff3e0" stroke="#e65100"/><text x="450" y="201" text-anchor="middle" font-weight="bold" fill="#e65100">S. epidermidis (CoNS)</text>
      <line x1="580" y1="196" x2="628" y2="196" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="176" width="250" height="40" rx="6" fill="#fff3e0"/><text x="640" y="194">Vancomycin</text><text x="640" y="209">+ gentamicin + rifampin (prosthetic)</text>
    </g>
    <g>
      <rect x="20" y="224" width="250" height="40" rx="6" fill="#e3f2fd"/><text x="30" y="242">After nosocomial UTI,</text><text x="30" y="257">GU / GI instrumentation</text>
      <line x1="270" y1="244" x2="318" y2="244" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="224" width="260" height="40" rx="6" fill="#e3f2fd" stroke="#2b6cb0"/><text x="450" y="249" text-anchor="middle" font-weight="bold" fill="#2b6cb0">Enterococcus faecalis</text>
      <line x1="580" y1="244" x2="628" y2="244" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="224" width="250" height="40" rx="6" fill="#e3f2fd"/><text x="640" y="242">Ampicillin + ceftriaxone</text><text x="640" y="257" font-size="10.5">(or + gentamicin)*</text>
    </g>
    <g>
      <rect x="20" y="272" width="250" height="40" rx="6" fill="#f3e5f5"/><text x="30" y="290">IE + iron-deficiency anaemia,</text><text x="30" y="305">GI bleed → COLONOSCOPY</text>
      <line x1="270" y1="292" x2="318" y2="292" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="272" width="260" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/><text x="450" y="290" text-anchor="middle" font-weight="bold" fill="#6a1b9a">S. gallolyticus (bovis)</text><text x="450" y="305" text-anchor="middle" font-size="10.5">colorectal cancer link</text>
      <line x1="580" y1="292" x2="628" y2="292" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="272" width="250" height="40" rx="6" fill="#f3e5f5"/><text x="640" y="297">Penicillin G / ceftriaxone*</text>
    </g>
    <g>
      <rect x="20" y="320" width="250" height="40" rx="6" fill="#fffde7"/><text x="30" y="338">Poor dental hygiene; culture-</text><text x="30" y="353">negative, large vegetations</text>
      <line x1="270" y1="340" x2="318" y2="340" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="320" width="260" height="40" rx="6" fill="#fffde7" stroke="#8a6d00"/><text x="450" y="338" text-anchor="middle" font-weight="bold" fill="#8a6d00">HACEK</text><text x="450" y="353" text-anchor="middle" font-size="10.5">oral gram-negative rods</text>
      <line x1="580" y1="340" x2="628" y2="340" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="320" width="250" height="40" rx="6" fill="#fffde7"/><text x="640" y="345">Ceftriaxone (first line)</text>
    </g>
    <g>
      <rect x="20" y="368" width="250" height="40" rx="6" fill="#eceff1"/><text x="30" y="386">Culture-negative: farm animals /</text><text x="30" y="401">cats, homeless (lice); immunosupp.</text>
      <line x1="270" y1="388" x2="318" y2="388" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="320" y="368" width="260" height="40" rx="6" fill="#eceff1" stroke="#546e7a"/><text x="450" y="386" text-anchor="middle" font-weight="bold" fill="#37474f">Coxiella · Bartonella · fungi</text><text x="450" y="401" text-anchor="middle" font-size="10.5">(Candida, Aspergillus)</text>
      <line x1="580" y1="388" x2="628" y2="388" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
      <rect x="630" y="368" width="250" height="40" rx="6" fill="#eceff1"/><text x="640" y="386">Serology; fungal → surgery +</text><text x="640" y="401">antifungal*</text>
    </g>
  </g>
  <text x="890" y="432" text-anchor="end" font-size="9.5" fill="#555">* added (not on slides). Empiric: native = vancomycin + β-lactam; prosthetic = + gentamicin + rifampin</text>
</svg>
