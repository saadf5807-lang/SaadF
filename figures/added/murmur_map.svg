<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Murmur map: timing → shape → site → radiation → manoeuvre</text>
  <g font-size="11.5">
    <rect x="20" y="42" width="860" height="28" fill="#0b3d6b"/>
    <g fill="#fff" font-weight="bold">
      <text x="30" y="61">Lesion</text><text x="140" y="61">Shape (S1 … S2 … S1)</text><text x="400" y="61">Where / radiates</text><text x="590" y="61">Extra sounds</text><text x="730" y="61">Louder with</text>
    </g>
    <!-- rows -->
    <g>
      <rect x="20" y="70" width="860" height="78" fill="#fdecea"/>
      <text x="30" y="98" font-weight="bold" fill="#b3261e" font-size="13">AS</text>
      <text x="30" y="116" font-size="10.5">systolic</text>
      <line x1="140" y1="125" x2="370" y2="125" stroke="#999"/>
      <rect x="148" y="95" width="6" height="30" fill="#333"/><rect x="300" y="105" width="5" height="20" fill="#333"/>
      <path d="M170,125 L225,90 L280,125 Z" fill="#b3261e" opacity=".75"/>
      <text x="150" y="141" font-size="9.5">S1 · click · diamond · soft S2</text>
      <text x="400" y="98">R 2nd ICS → both carotids</text>
      <text x="400" y="116">Pulsus parvus et tardus</text>
      <text x="590" y="98">Ejection click, S4</text><text x="590" y="116">Soft/single S2</text>
      <text x="730" y="98">↑ preload (squat, leg raise)</text><text x="730" y="116" fill="#555">↓ handgrip, Valsalva</text>
    </g>
    <g>
      <rect x="20" y="148" width="860" height="78" fill="#e3f2fd"/>
      <text x="30" y="176" font-weight="bold" fill="#2b6cb0" font-size="13">MR</text>
      <text x="30" y="194" font-size="10.5">systolic</text>
      <line x1="140" y1="203" x2="370" y2="203" stroke="#999"/>
      <rect x="148" y="178" width="5" height="25" fill="#333"/><rect x="300" y="178" width="5" height="25" fill="#333"/>
      <rect x="155" y="180" width="143" height="23" fill="#2b6cb0" opacity=".7"/>
      <text x="150" y="219" font-size="9.5">holosystolic, blowing (S1 soft)</text>
      <text x="400" y="176">Apex → LEFT AXILLA</text>
      <text x="400" y="194">Displaced apex (LV dilated)</text>
      <text x="590" y="176">S3 (volume load)</text>
      <text x="730" y="176">Handgrip (↑ afterload)</text><text x="730" y="194">Leg raise (↑ preload)</text>
    </g>
    <g>
      <rect x="20" y="226" width="860" height="78" fill="#f3e5f5"/>
      <text x="30" y="254" font-weight="bold" fill="#6a1b9a" font-size="13">MVP</text>
      <text x="30" y="272" font-size="10.5">systolic</text>
      <line x1="140" y1="281" x2="370" y2="281" stroke="#999"/>
      <rect x="148" y="256" width="5" height="25" fill="#333"/><rect x="300" y="256" width="5" height="25" fill="#333"/>
      <rect x="225" y="252" width="4" height="29" fill="#b3261e"/>
      <rect x="232" y="262" width="66" height="19" fill="#6a1b9a" opacity=".6"/>
      <text x="150" y="297" font-size="9.5">mid-systolic CLICK → late murmur</text>
      <text x="400" y="254">Apex (± axilla)</text>
      <text x="400" y="272">Young women, Marfan, EDS</text>
      <text x="590" y="254">Midsystolic click</text>
      <text x="730" y="254">Standing / Valsalva</text><text x="730" y="272" fill="#555">(click earlier, longer)</text><text x="730" y="290" fill="#555">↓ squatting</text>
    </g>
    <g>
      <rect x="20" y="304" width="860" height="78" fill="#fff3e0"/>
      <text x="30" y="332" font-weight="bold" fill="#e65100" font-size="13">AR</text>
      <text x="30" y="350" font-size="10.5">diastolic</text>
      <line x1="140" y1="359" x2="370" y2="359" stroke="#999"/>
      <rect x="148" y="334" width="5" height="25" fill="#333"/><rect x="210" y="334" width="5" height="25" fill="#333"/>
      <path d="M217,332 L217,359 L300,359 Z" fill="#e65100" opacity=".75"/>
      <text x="150" y="375" font-size="9.5">S2 → early decrescendo, blowing</text>
      <text x="400" y="332">L sternal edge (3rd–4th ICS)</text>
      <text x="400" y="350">Sit up, lean forward, expiration</text>
      <text x="590" y="332">S3, Austin Flint</text><text x="590" y="350">(apical mid-diastolic)</text>
      <text x="730" y="332">Handgrip (↑ afterload)</text><text x="730" y="350">Collapsing pulse, wide PP</text>
    </g>
    <g>
      <rect x="20" y="382" width="860" height="78" fill="#e8f5e9"/>
      <text x="30" y="410" font-weight="bold" fill="#2e7d32" font-size="13">MS</text>
      <text x="30" y="428" font-size="10.5">diastolic</text>
      <line x1="140" y1="437" x2="370" y2="437" stroke="#999"/>
      <rect x="148" y="407" width="7" height="30" fill="#333"/><rect x="210" y="412" width="5" height="25" fill="#333"/>
      <rect x="232" y="412" width="3" height="25" fill="#b3261e"/>
      <path d="M236,425 L265,437 L330,437 L360,415 L360,437 Z" fill="#2e7d32" opacity=".7"/>
      <text x="150" y="453" font-size="9.5">LOUD S1 · S2 · opening snap · rumble</text>
      <text x="400" y="410">APEX, left lateral position, bell</text>
      <text x="400" y="428">No radiation</text>
      <text x="590" y="410">Loud S1, opening snap</text><text x="590" y="428" fill="#555">(short S2–OS = severe)</text>
      <text x="730" y="410">Exercise, left lateral</text><text x="730" y="428">Malar flush, AF</text>
    </g>
    <g>
      <rect x="20" y="460" width="860" height="78" fill="#fffde7"/>
      <text x="30" y="488" font-weight="bold" fill="#8a6d00" font-size="13">TR</text>
      <text x="30" y="506" font-size="10.5">systolic</text>
      <line x1="140" y1="515" x2="370" y2="515" stroke="#999"/>
      <rect x="148" y="490" width="5" height="25" fill="#333"/><rect x="300" y="490" width="5" height="25" fill="#333"/>
      <rect x="155" y="492" width="143" height="23" fill="#8a6d00" opacity=".55"/>
      <text x="150" y="531" font-size="9.5">pansystolic (like MR)</text>
      <text x="400" y="488">L lower sternal edge → apex,</text>
      <text x="400" y="506">NOT to axilla</text>
      <text x="590" y="488">Giant v waves,</text><text x="590" y="506">pulsatile liver</text>
      <text x="730" y="488">INSPIRATION (Carvallo)</text><text x="730" y="506" fill="#555">Right-sided ↑ on inspiration</text>
    </g>
  </g>
  <text x="450" y="553" text-anchor="middle" font-size="10" fill="#555">Rule: right-sided murmurs ↑ on inspiration; left-sided ↑ on expiration. Only HCM and MVP get LOUDER with Valsalva/standing.</text>
</svg>
