<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Arial, Helvetica, sans-serif">
<rect width="880" height="560" fill="#fff"/>
<text x="440" y="28" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="bold">Tic-Tac-Toe method (named in objectives, not taught on slides) [added]</text>
<text x="205.0" y="70" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">ACID</text>
<text x="315.0" y="70" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">NORMAL</text>
<text x="425.0" y="70" font-size="14" text-anchor="middle" fill="#2e86c1" font-weight="bold">BASE</text>
<text x="138" y="112" font-size="14" text-anchor="end" fill="#1b2733" font-weight="bold">pH</text>
<rect x="150" y="80" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="205.0" y="95" font-size="11" text-anchor="middle" fill="#777">&lt; 7.35</text>
<rect x="260" y="80" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="315.0" y="95" font-size="11" text-anchor="middle" fill="#777">7.35–7.45</text>
<rect x="370" y="80" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="425.0" y="95" font-size="11" text-anchor="middle" fill="#777">&gt; 7.45</text>
<text x="138" y="164" font-size="14" text-anchor="end" fill="#1b2733" font-weight="bold">PaCO₂</text>
<rect x="150" y="132" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="205.0" y="147" font-size="11" text-anchor="middle" fill="#777">&gt; 45</text>
<rect x="260" y="132" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="315.0" y="147" font-size="11" text-anchor="middle" fill="#777">35–45</text>
<rect x="370" y="132" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="425.0" y="147" font-size="11" text-anchor="middle" fill="#777">&lt; 35</text>
<text x="138" y="216" font-size="14" text-anchor="end" fill="#1b2733" font-weight="bold">HCO₃⁻</text>
<rect x="150" y="184" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="205.0" y="199" font-size="11" text-anchor="middle" fill="#777">&lt; 22</text>
<rect x="260" y="184" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="315.0" y="199" font-size="11" text-anchor="middle" fill="#777">22–26</text>
<rect x="370" y="184" width="110" height="52" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
<text x="425.0" y="199" font-size="11" text-anchor="middle" fill="#777">&gt; 26</text>
<text x="315.0" y="260" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Note: high CO₂ = ACID column; low CO₂ = BASE column</text>
<circle cx="205.0" cy="115" r="12" fill="none" stroke="#7d3c98" stroke-width="3"/>
<text x="205.0" y="121" font-size="12" text-anchor="middle" fill="#7d3c98" font-weight="bold">7.20</text>
<circle cx="425.0" cy="167" r="12" fill="none" stroke="#7d3c98" stroke-width="3"/>
<text x="425.0" y="173" font-size="12" text-anchor="middle" fill="#7d3c98" font-weight="bold">25</text>
<circle cx="205.0" cy="219" r="12" fill="none" stroke="#7d3c98" stroke-width="3"/>
<text x="205.0" y="225" font-size="12" text-anchor="middle" fill="#7d3c98" font-weight="bold">10</text>
<line x1="205.0" y1="116" x2="205.0" y2="220" stroke="#c0392b" stroke-width="4" opacity="0.5"/>
<text x="315.0" y="282" font-size="12" text-anchor="middle" fill="#1b2733" font-weight="bold">Example = slide Case 4: pH 7.20 · PaCO₂ 25 · HCO₃⁻ 10</text>
<rect x="545" y="60" width="330" height="250" rx="6" fill="#eef3f8" stroke="#44546a" stroke-width="2"/>
<text x="710" y="85" font-size="15" text-anchor="middle" fill="#1b2733" font-weight="bold">Read the grid</text>
<text x="560" y="110" font-size="12" text-anchor="start" fill="#1b2733">1. Circle each value in its column.</text>
<text x="560" y="129" font-size="12" text-anchor="start" fill="#1b2733">2. The value sharing pH's column</text>
<text x="560" y="148" font-size="12" text-anchor="start" fill="#1b2733" font-weight="bold">    = PRIMARY disorder</text>
<text x="560" y="167" font-size="12" text-anchor="start" fill="#1b2733">    (CO₂ → respiratory; HCO₃ → metabolic).</text>
<text x="560" y="186" font-size="12" text-anchor="start" fill="#1b2733">3. Other value in the OPPOSITE column</text>
<text x="560" y="205" font-size="12" text-anchor="start" fill="#1b2733">    = compensation.</text>
<text x="560" y="224" font-size="12" text-anchor="start" fill="#1b2733">4. Other value NORMAL = uncompensated.</text>
<text x="560" y="243" font-size="12" text-anchor="start" fill="#1b2733">5. pH normal + both abnormal</text>
<text x="560" y="262" font-size="12" text-anchor="start" fill="#1b2733">    = fully compensated (or mixed).</text>
<text x="560" y="281" font-size="12" text-anchor="start" fill="#1b2733" font-weight="bold">6. Both in pH's column = MIXED disorder.</text>
<rect x="20" y="330" width="840" height="215" rx="6" fill="#fdf3e3" stroke="#c98a1b" stroke-width="2"/>
<text x="440" y="354" font-size="15" text-anchor="middle" fill="#1b2733" font-weight="bold">Full 6-step ABG routine (slides 20–23 + added steps)</text>
<text x="40" y="382" font-size="12" text-anchor="start" fill="#1b2733">1  pH → acidaemia / alkalaemia / normal</text>
<text x="40" y="405" font-size="12" text-anchor="start" fill="#1b2733">2  PaCO₂ vs pH: SAME direction → Metabolic; OPPOSITE → REspiratory (SMORE)</text>
<text x="40" y="428" font-size="12" text-anchor="start" fill="#1b2733">3  Compensation formula → appropriate? if not → second process (body never overcompensates)</text>
<text x="40" y="451" font-size="12" text-anchor="start" fill="#1b2733">4  Anion gap = Na − (Cl + HCO₃): normal 6–12 (8–12 on summary slide) — check it EVEN if pH normal</text>
<text x="40" y="474" font-size="12" text-anchor="start" fill="#1b2733">5  High AG → delta ratio ΔAG ÷ ΔHCO₃: &lt; 1 + NAGMA, 1–2 pure, &gt; 2 + metabolic alkalosis [added]</text>
<text x="40" y="497" font-size="12" text-anchor="start" fill="#1b2733">6  Suspect toxic alcohol → osmolar gap; correct AG for albumin (+2.5 per 1 g/dL ↓) [added]</text>
<text x="40" y="520" font-size="12" text-anchor="start" fill="#7d3c98" font-weight="bold">Case 4 worked: AG = 135 − 105 = 30 (high) · Winter = 1.5×10 + 8 = 23 ± 2 → 25 OK · Δratio = 18/14 ≈ 1.3 → pure HAGMA</text>
</svg>