<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="400" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">AV block: follow the PR interval and the dropped QRS</text>
  <g font-size="12">
    <rect x="20" y="44" width="860" height="26" fill="#0b3d6b"/>
    <g fill="#fff" font-weight="bold"><text x="30" y="62">Degree</text><text x="200" y="62">PR / pattern (P = blue, QRS = black)</text><text x="560" y="62">Level · danger · treatment</text></g>
    <g id="r1">
      <rect x="20" y="70" width="860" height="70" fill="#e8f5e9"/>
      <text x="30" y="98" font-weight="bold" fill="#2e7d32">1st degree</text><text x="30" y="116" font-size="10.5">every P conducts</text>
      <g stroke-width="3">
        <line x1="200" y1="118" x2="200" y2="98" stroke="#2b6cb0"/><line x1="245" y1="118" x2="245" y2="80" stroke="#333"/>
        <line x1="290" y1="118" x2="290" y2="98" stroke="#2b6cb0"/><line x1="335" y1="118" x2="335" y2="80" stroke="#333"/>
        <line x1="380" y1="118" x2="380" y2="98" stroke="#2b6cb0"/><line x1="425" y1="118" x2="425" y2="80" stroke="#333"/>
        <line x1="470" y1="118" x2="470" y2="98" stroke="#2b6cb0"/><line x1="515" y1="118" x2="515" y2="80" stroke="#333"/>
      </g>
      <text x="200" y="134" font-size="10.5">PR constant &gt; 0.20 s</text>
      <text x="560" y="94">AV node · benign</text><text x="560" y="112">No treatment; review drugs</text><text x="560" y="128" font-size="10.5" fill="#555">(β-blocker, CCB, digoxin)</text>
    </g>
    <g>
      <rect x="20" y="140" width="860" height="70" fill="#fffde7"/>
      <text x="30" y="168" font-weight="bold" fill="#8a6d00">2nd Mobitz I</text><text x="30" y="186" font-size="10.5">(Wenckebach)</text>
      <g stroke-width="3">
        <line x1="200" y1="188" x2="200" y2="168" stroke="#2b6cb0"/><line x1="222" y1="188" x2="222" y2="150" stroke="#333"/>
        <line x1="270" y1="188" x2="270" y2="168" stroke="#2b6cb0"/><line x1="305" y1="188" x2="305" y2="150" stroke="#333"/>
        <line x1="350" y1="188" x2="350" y2="168" stroke="#2b6cb0"/><line x1="398" y1="188" x2="398" y2="150" stroke="#333"/>
        <line x1="440" y1="188" x2="440" y2="168" stroke="#2b6cb0"/>
        <line x1="510" y1="188" x2="510" y2="168" stroke="#2b6cb0"/><line x1="532" y1="188" x2="532" y2="150" stroke="#333"/>
      </g>
      <text x="200" y="204" font-size="10.5">PR lengthens → P not conducted → resets</text>
      <text x="560" y="164">AV node · usually benign (inferior MI, vagal)</text><text x="560" y="182">Symptomatic → atropine</text><text x="560" y="198" font-size="10.5" fill="#555">Grouped beating</text>
    </g>
    <g>
      <rect x="20" y="210" width="860" height="70" fill="#fff3e0"/>
      <text x="30" y="238" font-weight="bold" fill="#e65100">2nd Mobitz II</text><text x="30" y="256" font-size="10.5">(± high-grade)</text>
      <g stroke-width="3">
        <line x1="200" y1="258" x2="200" y2="238" stroke="#2b6cb0"/><line x1="235" y1="258" x2="235" y2="220" stroke="#333"/>
        <line x1="280" y1="258" x2="280" y2="238" stroke="#2b6cb0"/><line x1="315" y1="258" x2="315" y2="220" stroke="#333"/>
        <line x1="360" y1="258" x2="360" y2="238" stroke="#2b6cb0"/>
        <line x1="440" y1="258" x2="440" y2="238" stroke="#2b6cb0"/><line x1="475" y1="258" x2="475" y2="220" stroke="#333"/>
        <line x1="520" y1="258" x2="520" y2="238" stroke="#2b6cb0"/>
      </g>
      <text x="200" y="274" font-size="10.5">PR CONSTANT, sudden dropped QRS (wide QRS often)</text>
      <text x="560" y="234">His–Purkinje · can → complete block</text><text x="560" y="252" font-weight="bold">Permanent pacemaker</text><text x="560" y="268" font-size="10.5" fill="#555">Atropine often ineffective → pace</text>
    </g>
    <g>
      <rect x="20" y="280" width="860" height="80" fill="#fdecea"/>
      <text x="30" y="308" font-weight="bold" fill="#b3261e">3rd degree</text><text x="30" y="326" font-size="10.5">(complete)</text>
      <g stroke-width="3">
        <line x1="200" y1="338" x2="200" y2="318" stroke="#2b6cb0"/><line x1="245" y1="338" x2="245" y2="318" stroke="#2b6cb0"/>
        <line x1="290" y1="338" x2="290" y2="318" stroke="#2b6cb0"/><line x1="335" y1="338" x2="335" y2="318" stroke="#2b6cb0"/>
        <line x1="380" y1="338" x2="380" y2="318" stroke="#2b6cb0"/><line x1="425" y1="338" x2="425" y2="318" stroke="#2b6cb0"/>
        <line x1="470" y1="338" x2="470" y2="318" stroke="#2b6cb0"/><line x1="515" y1="338" x2="515" y2="318" stroke="#2b6cb0"/>
        <line x1="222" y1="338" x2="222" y2="290" stroke="#333"/><line x1="340" y1="338" x2="340" y2="290" stroke="#333"/><line x1="458" y1="338" x2="458" y2="290" stroke="#333"/>
      </g>
      <text x="200" y="354" font-size="10.5">P and QRS independent (AV dissociation); escape ~45/min</text>
      <text x="560" y="304">Junctional (narrow) or ventricular (wide) escape</text><text x="560" y="322">Cannon a waves · syncope (Stokes–Adams)</text><text x="560" y="340" font-weight="bold">Atropine → pacing → PERMANENT PACEMAKER</text>
    </g>
  </g>
  <text x="450" y="388" text-anchor="middle" font-size="10.5" fill="#555">Unstable bradycardia: atropine 1 mg IV q3–5 min (max 3 mg) → transcutaneous/transvenous pacing or dopamine/adrenaline infusion</text>
</svg>
