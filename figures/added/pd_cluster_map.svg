<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="900" height="640" fill="#fff"/>
<text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">The 10 personality disorders: mnemonic · threshold · one hook</text>
<text x="450" y="50" text-anchor="middle" font-size="12" fill="#444">Step 1: meet general criteria A–F first · Step 2: exclude state, substance, organic, age &lt;18, culture, normal reaction · Step 3: type</text>
<rect x="20" y="66" width="275" height="40" rx="6" fill="#5e35b1"/>
<text x="157.5" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">CLUSTER A</text>
<text x="157.5" y="100" text-anchor="middle" font-size="11" fill="#fff">Odd / eccentric · WEIRD</text>
<rect x="20" y="114" width="275" height="78" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
<text x="30" y="136" font-size="14" font-weight="bold" fill="#222">Paranoid</text>
<text x="285" y="136" text-anchor="end" font-size="12" font-weight="bold" fill="#5e35b1">≥4 of 7</text>
<text x="30" y="160" font-size="15" font-weight="bold" fill="#5e35b1" letter-spacing="1">SUSPECT</text>
<text x="30" y="181" font-size="11.5" fill="#333">distrust; NO delusions</text>
<rect x="20" y="200" width="275" height="78" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
<text x="30" y="222" font-size="14" font-weight="bold" fill="#222">Schizoid</text>
<text x="285" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#5e35b1">≥4 of 7</text>
<text x="30" y="246" font-size="15" font-weight="bold" fill="#5e35b1" letter-spacing="1">DISTANT</text>
<text x="30" y="267" font-size="11.5" fill="#333">detached; NO desire</text>
<rect x="20" y="286" width="275" height="78" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
<text x="30" y="308" font-size="14" font-weight="bold" fill="#222">Schizotypal</text>
<text x="285" y="308" text-anchor="end" font-size="12" font-weight="bold" fill="#5e35b1">≥5 of 9</text>
<text x="30" y="332" font-size="15" font-weight="bold" fill="#5e35b1" letter-spacing="1">ME PECULIAR</text>
<text x="30" y="353" font-size="11.5" fill="#333">odd beliefs; schizo-spectrum</text>
<rect x="313" y="66" width="275" height="40" rx="6" fill="#c62828"/>
<text x="450.5" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">CLUSTER B</text>
<text x="450.5" y="100" text-anchor="middle" font-size="11" fill="#fff">Dramatic / erratic · WILD</text>
<rect x="313" y="114" width="275" height="78" rx="6" fill="#ffebee" stroke="#c62828"/>
<text x="323" y="136" font-size="14" font-weight="bold" fill="#222">Antisocial</text>
<text x="578" y="136" text-anchor="end" font-size="12" font-weight="bold" fill="#c62828">≥3 of 7</text>
<text x="323" y="160" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">CORRUPT</text>
<text x="323" y="181" font-size="11.5" fill="#333">+ age ≥18 + CD before 15</text>
<rect x="313" y="200" width="275" height="78" rx="6" fill="#ffebee" stroke="#c62828"/>
<text x="323" y="222" font-size="14" font-weight="bold" fill="#222">Borderline ⭐</text>
<text x="578" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#c62828">≥5 of 9</text>
<text x="323" y="246" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">AM SUICIDE</text>
<text x="323" y="267" font-size="11.5" fill="#333">suicide 8–10%; DBT</text>
<rect x="313" y="286" width="275" height="78" rx="6" fill="#ffebee" stroke="#c62828"/>
<text x="323" y="308" font-size="14" font-weight="bold" fill="#222">Histrionic</text>
<text x="578" y="308" text-anchor="end" font-size="12" font-weight="bold" fill="#c62828">≥5 of 8</text>
<text x="323" y="332" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">PRAISE ME</text>
<text x="323" y="353" font-size="11.5" fill="#333">shallow, shifting emotion</text>
<rect x="313" y="372" width="275" height="78" rx="6" fill="#ffebee" stroke="#c62828"/>
<text x="323" y="394" font-size="14" font-weight="bold" fill="#222">Narcissistic</text>
<text x="578" y="394" text-anchor="end" font-size="12" font-weight="bold" fill="#c62828">≥5 of 9</text>
<text x="323" y="418" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">GRANDIOSE</text>
<text x="323" y="439" font-size="11.5" fill="#333">vulnerable type ≈ depression</text>
<rect x="606" y="66" width="275" height="40" rx="6" fill="#2e7d32"/>
<text x="743.5" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">CLUSTER C</text>
<text x="743.5" y="100" text-anchor="middle" font-size="11" fill="#fff">Anxious / fearful · WORRIED</text>
<rect x="606" y="114" width="275" height="78" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="616" y="136" font-size="14" font-weight="bold" fill="#222">Avoidant</text>
<text x="871" y="136" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">≥4 of 7</text>
<text x="616" y="160" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">AFRAID</text>
<text x="616" y="181" font-size="11.5" fill="#333">WANTS contact, fears rejection</text>
<rect x="606" y="200" width="275" height="78" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="616" y="222" font-size="14" font-weight="bold" fill="#222">Dependent</text>
<text x="871" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">≥5 of 8</text>
<text x="616" y="246" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">RELIANCE</text>
<text x="616" y="267" font-size="11.5" fill="#333">check against family norms</text>
<rect x="606" y="286" width="275" height="78" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="616" y="308" font-size="14" font-weight="bold" fill="#222">Obsessive–compulsive</text>
<text x="871" y="308" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">≥4 of 8</text>
<text x="616" y="332" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">LAW FIRMS</text>
<text x="616" y="353" font-size="11.5" fill="#333">ego-SYNTONIC; commonest PD</text>
<rect x="20" y="470" width="861" height="156" rx="8" fill="#fff8e1" stroke="#f57f17"/>
<text x="34" y="494" font-size="14" font-weight="bold" fill="#e65100">Look-alike pairs: the ONE word that separates them</text>
<text x="34" y="518.0" font-size="12" font-weight="bold" fill="#222">Schizoid vs Avoidant</text>
<text x="300" y="518.0" font-size="12" fill="#333">→ DESIRE for relationships (absent vs blocked by fear)</text>
<text x="34" y="536.5" font-size="12" font-weight="bold" fill="#222">OCPD vs OCD</text>
<text x="300" y="536.5" font-size="12" fill="#333">→ ego-SYNTONIC vs ego-DYSTONIC (true obsessions/compulsions)</text>
<text x="34" y="555.0" font-size="12" font-weight="bold" fill="#222">Borderline vs Bipolar</text>
<text x="300" y="555.0" font-size="12" fill="#333">→ HOURS + interpersonal trigger vs DAYS–weeks + ↓need for sleep</text>
<text x="34" y="573.5" font-size="12" font-weight="bold" fill="#222">Paranoid/Schizotypal vs psychosis</text>
<text x="300" y="573.5" font-size="12" fill="#333">→ short of frank delusions/hallucinations</text>
<text x="34" y="592.0" font-size="12" font-weight="bold" fill="#222">Antisocial vs Conduct disorder</text>
<text x="300" y="592.0" font-size="12" fill="#333">→ age: &lt;18 = conduct disorder; ASPD needs CD before 15</text>
<text x="34" y="610.5" font-size="12" font-weight="bold" fill="#222">Histrionic vs Borderline</text>
<text x="300" y="610.5" font-size="12" fill="#333">→ no self-harm, no identity collapse</text>
</svg>