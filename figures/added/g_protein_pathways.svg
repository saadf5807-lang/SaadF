<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="400" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">GPCR signalling: the G-protein ON/OFF switch and its three α families</text>
  <g font-size="12.5">
    <rect x="20" y="48" width="860" height="92" rx="10" fill="#f7f9fc" stroke="#9fb3c8"/>
    <rect x="40" y="70" width="190" height="50" rx="8" fill="#f2f2f2" stroke="#999"/><text x="135" y="92" text-anchor="middle" font-weight="bold">OFF: α-GDP + βγ</text><text x="135" y="110" text-anchor="middle" font-size="11">resting heterotrimer</text>
    <line x1="232" y1="84" x2="345" y2="84" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
    <text x="288" y="77" text-anchor="middle" font-size="11" fill="#2e7d32">hormone binds GPCR</text><text x="288" y="102" text-anchor="middle" font-size="11" fill="#2e7d32">GDP → GTP exchange</text>
    <rect x="348" y="70" width="210" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32"/><text x="453" y="92" text-anchor="middle" font-weight="bold" fill="#2e7d32">ON: α-GTP (+ free βγ)</text><text x="453" y="110" text-anchor="middle" font-size="11">acts on effectors</text>
    <line x1="560" y1="84" x2="665" y2="84" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
    <text x="612" y="77" text-anchor="middle" font-size="11" fill="#b3261e">intrinsic GTPase</text><text x="612" y="102" text-anchor="middle" font-size="11" fill="#b3261e">GTP → GDP</text>
    <rect x="668" y="70" width="190" height="50" rx="8" fill="#f2f2f2" stroke="#999"/><text x="763" y="92" text-anchor="middle" font-weight="bold">Back to OFF</text><text x="763" y="110" text-anchor="middle" font-size="11">signal terminated</text>
    <rect x="20" y="160" width="270" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="155" y="184" text-anchor="middle" font-weight="bold" font-size="15" fill="#2e7d32">Gαs (stimulatory)</text>
    <text x="155" y="212" text-anchor="middle">↑ Adenylyl cyclase</text>
    <text x="155" y="236" text-anchor="middle">ATP → ↑ cAMP</text>
    <text x="155" y="260" text-anchor="middle">→ protein kinase A [added]</text>
    <rect x="315" y="160" width="270" height="150" rx="10" fill="#fdecea" stroke="#b3261e"/>
    <text x="450" y="184" text-anchor="middle" font-weight="bold" font-size="15" fill="#b3261e">Gαi (inhibitory)</text>
    <text x="450" y="212" text-anchor="middle">↓ Adenylyl cyclase</text>
    <text x="450" y="236" text-anchor="middle">↓ cAMP</text>
    <rect x="610" y="160" width="270" height="150" rx="10" fill="#e3f2fd" stroke="#2b6cb0"/>
    <text x="745" y="184" text-anchor="middle" font-weight="bold" font-size="15" fill="#2b6cb0">Gαq</text>
    <text x="745" y="212" text-anchor="middle">↑ Phospholipase C (PLCβ)</text>
    <text x="745" y="236" text-anchor="middle">→ IP₃ (↑ Ca²⁺) + DAG (PKC)</text>
    <text x="745" y="254" text-anchor="middle" font-size="11">[IP₃/DAG detail added]</text>
    <rect x="20" y="324" width="860" height="60" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="450" y="346" text-anchor="middle"><tspan font-weight="bold">βγ dimer</tspan> also signals: phospholipases, ion channels, lipid kinases</text>
    <text x="450" y="368" text-anchor="middle">GPCR = <tspan font-weight="bold">7 transmembrane loops</tspan> · &gt;1000 receptors · 1 GPCR → 1, 10 or more G-proteins (<tspan font-weight="bold">amplification</tspan>)</text>
  </g>
</svg>
