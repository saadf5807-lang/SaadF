<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="405" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d6b">Endocrine glands: who is under the pituitary and who is not</text>
  <g font-size="12.5">
    <rect x="330" y="45" width="240" height="40" rx="8" fill="#6a1b9a"/><text x="450" y="63" text-anchor="middle" fill="#fff" font-weight="bold">HYPOTHALAMUS</text><text x="450" y="78" text-anchor="middle" fill="#ede7f6" font-size="11">neuro-endocrine link</text>
    <line x1="450" y1="85" x2="450" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="270" y="107" width="360" height="40" rx="8" fill="#0b3d6b"/><text x="450" y="125" text-anchor="middle" fill="#fff" font-weight="bold">PITUITARY: "master gland"</text><text x="450" y="140" text-anchor="middle" fill="#dde8f3" font-size="11">GH · ACTH · TSH · FSH · LH · prolactin · ADH</text>
    <line x1="400" y1="147" x2="230" y2="182" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
    <rect x="30" y="184" width="400" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="230" y="206" text-anchor="middle" font-weight="bold" fill="#2e7d32">UNDER pituitary control</text>
    <text x="45" y="232">1. Thyroid: T4, T3 (+ calcitonin)</text>
    <text x="45" y="256">2. Suprarenal (adrenal) cortex: cortisol, aldosterone, DHEA</text>
    <text x="45" y="280">3. Gonads*: testosterone / estradiol, progesterone</text>
    <rect x="470" y="184" width="400" height="120" rx="8" fill="#fdecea" stroke="#b3261e"/>
    <text x="670" y="206" text-anchor="middle" font-weight="bold" fill="#b3261e">NOT under pituitary control</text>
    <text x="485" y="232">1. Parathyroids: PTH</text>
    <text x="485" y="256">2. Suprarenal (adrenal) medulla: adrenaline, NA [added]</text>
    <text x="485" y="280">3. Pancreas*: insulin, glucagon</text>
    <rect x="30" y="318" width="840" height="74" rx="8" fill="#fff7e8" stroke="#d9822b"/>
    <text x="450" y="340" text-anchor="middle">* = <tspan font-weight="bold">mixed glands</tspan> (endocrine + exocrine): gonads and pancreas</text>
    <text x="450" y="362" text-anchor="middle" font-size="12">Part-time endocrine organs: heart (ANP) · kidney (EPO, calcitriol, renin) · liver (somatomedins, 25-OH-D, hepcidin)</text><text x="450" y="382" text-anchor="middle" font-size="12">skin (vitamin D) · GIT (gastrin, CCK, secretin, VIP) · pineal (melatonin)</text>
  </g>
</svg>
